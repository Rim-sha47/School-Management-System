<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | The Providence School</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">

  <!-- Background Animated Blobs -->
  <div class="login-bg-blob blob-1"></div>
  <div class="login-bg-blob blob-2"></div>
  <div class="login-bg-blob blob-3"></div>

  <!-- Header -->
  <header class="login-header">
    <a href="index.html">
      <img src="assets/images/logo.png" alt="Logo" class="login-logo" onerror="this.src='https://via.placeholder.com/90?text=PS'">
    </a>
    <h1 class="login-school-name">The Providence School</h1>
    <div class="login-tagline">Read. Succeed. Lead.</div>
  </header>

  <!-- Login Cards -->
  <section class="login-cards-section container">
    <div class="row w-100 justify-content-center g-4">
      
      <!-- Admin Login -->
      <div class="col-lg-4 col-md-6">
        <div class="login-card admin-card">
          <div class="card-icon-wrap">
            <i class="fas fa-user-shield"></i>
          </div>
          <h2 class="card-title">Admin Login</h2>
          <p class="card-subtitle">Manage the entire school system</p>
          
          <form class="login-form" data-role="admin">
            <div class="login-form-group">
              <label class="login-label">Username</label>
              <div class="login-input-wrap">
                <i class="fas fa-user login-input-icon"></i>
                <input type="text" class="login-input" placeholder="Enter admin username" required>
              </div>
            </div>
            
            <div class="login-form-group">
              <label class="login-label">Password</label>
              <div class="login-input-wrap">
                <i class="fas fa-lock login-input-icon"></i>
                <input type="password" class="login-input" placeholder="Enter password" required>
                <button type="button" class="toggle-pw" aria-label="Toggle Password Visibility"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            
            <div class="login-options">
              <label class="remember-check">
                <input type="checkbox">
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">
              Login as Admin <i class="fas fa-arrow-right ms-1"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Teacher Login -->
      <div class="col-lg-4 col-md-6">
        <div class="login-card teacher-card">
          <div class="card-icon-wrap">
            <i class="fas fa-chalkboard-teacher"></i>
          </div>
          <h2 class="card-title">Teacher Login</h2>
          <p class="card-subtitle">Manage classes and students</p>
          
          <form class="login-form" data-role="teacher">
            <div class="login-form-group">
              <label class="login-label">Username / ID</label>
              <div class="login-input-wrap">
                <i class="fas fa-id-badge login-input-icon"></i>
                <input type="text" class="login-input" placeholder="Enter teacher ID" required>
              </div>
            </div>
            
            <div class="login-form-group">
              <label class="login-label">Password</label>
              <div class="login-input-wrap">
                <i class="fas fa-lock login-input-icon"></i>
                <input type="password" class="login-input" placeholder="Enter password" required>
                <button type="button" class="toggle-pw" aria-label="Toggle Password Visibility"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            
            <div class="login-options">
              <label class="remember-check">
                <input type="checkbox">
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">
              Login as Teacher <i class="fas fa-arrow-right ms-1"></i>
            </button>
          </form>
        </div>
      </div>

      <!-- Student Login -->
      <div class="col-lg-4 col-md-6">
        <div class="login-card student-card">
          <div class="card-icon-wrap">
            <i class="fas fa-user-graduate"></i>
          </div>
          <h2 class="card-title">Student Login</h2>
          <p class="card-subtitle">Access your portal</p>
          
          <form class="login-form" data-role="student">
            <div class="login-form-group">
              <label class="login-label">Registration Number</label>
              <div class="login-input-wrap">
                <i class="fas fa-hashtag login-input-icon"></i>
                <input type="text" class="login-input" placeholder="Enter reg number" required>
              </div>
            </div>
            
            <div class="login-form-group">
              <label class="login-label">Password</label>
              <div class="login-input-wrap">
                <i class="fas fa-lock login-input-icon"></i>
                <input type="password" class="login-input" placeholder="Enter password" required>
                <button type="button" class="toggle-pw" aria-label="Toggle Password Visibility"><i class="fas fa-eye"></i></button>
              </div>
            </div>
            
            <div class="login-options">
              <label class="remember-check">
                <input type="checkbox">
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="login-btn">
              Login as Student <i class="fas fa-arrow-right ms-1"></i>
            </button>
          </form>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer class="login-footer">
    &copy; 2026 The Providence School. <a href="index.html" class="text-white-50 text-decoration-none">Back to Home</a>
  </footer>

  <script src="assets/js/login.js"></script>
</body>
</html>
